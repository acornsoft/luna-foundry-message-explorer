name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-license:
    name: build, test, and license check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MessageExplorer.sln --configuration Release

      - name: Test
        run: dotnet test MessageExplorer.sln --configuration Release --no-build --verbosity normal

      - name: License check
        run: bash eng/check-license.sh
