name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-license:
    name: build, test, and license check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MessageExplorer.sln --configuration Release

      - name: Test
        run: dotnet test MessageExplorer.sln --configuration Release --no-build --verbosity normal

      - name: License check
        run: bash eng/check-license.sh

      - name: Secret Service integration test (GNOME Keyring, throwaway keyring)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring libsecret-1-0 dbus-x11
          bash eng/ci/linux-keyring-tests.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser vault tests (headless Chromium, real WebCrypto and IndexedDB, C# through JSImport)
        working-directory: tests/browser-vault
        env:
          LFME_INTEROP_DIR: ${{ runner.temp }}/interop-app
          LFME_REQUIRE_INTEROP: "1"
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          dotnet publish interop-app/InteropApp.csproj --configuration Release --output "$LFME_INTEROP_DIR"
          npm test

  windows-credentials:
    name: Windows Credential Manager (unit + integration)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Credential tests against the real Credential Manager
        shell: pwsh
        env:
          LFME_SECURE_STORE_TESTS: "1"
        run: dotnet test tests/ME.Credentials.Tests/ME.Credentials.Tests.csproj --configuration Release --verbosity normal

  macos-dmg-linux:
    name: macOS DMG built on Linux (ad-hoc signed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q hfsprogs zlib1g-dev libbz2-dev
          bash eng/macos/install-linux-tools.sh .tools/macos

      - name: Package
        run: LFME_MAC_TOOLS="$PWD/.tools/macos" bash eng/package-macos.sh --out artifacts/dist

      - name: Verify DMGs
        run: |
          export LFME_MAC_TOOLS="$PWD/.tools/macos"
          bash eng/macos/verify-dmg.sh artifacts/dist/*-arm64.dmg arm64
          bash eng/macos/verify-dmg.sh artifacts/dist/*-x64.dmg x64

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: lfme-dmg-built-on-linux
          path: |
            artifacts/dist/*.dmg
            artifacts/dist/SHA256SUMS.txt
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG on a Mac (package, verify, launch)
    runs-on: macos-latest
    needs: macos-dmg-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Keychain integration test (SecItem add, read, replace, delete under a test service)
        env:
          LFME_SECURE_STORE_TESTS: "1"
        run: dotnet test tests/ME.Credentials.Tests/ME.Credentials.Tests.csproj --configuration Release --verbosity normal

      - name: Package with codesign and hdiutil
        run: bash eng/package-macos.sh --out artifacts/dist

      - name: Verify DMGs
        run: |
          bash eng/macos/verify-dmg.sh artifacts/dist/*-arm64.dmg arm64
          bash eng/macos/verify-dmg.sh artifacts/dist/*-x64.dmg x64

      - name: Launch the arm64 app and run the bundled sample
        run: bash eng/macos/smoke-test.sh artifacts/dist/*-arm64.dmg artifacts/smoke/mac-built-arm64.txt artifacts/smoke/mac-built-arm64.png

      - name: Download the DMGs built on Linux
        uses: actions/download-artifact@v4
        with:
          name: lfme-dmg-built-on-linux
          path: artifacts/linux-built

      - name: Verify and launch the arm64 DMG built on Linux
        run: |
          bash eng/macos/verify-dmg.sh artifacts/linux-built/*-arm64.dmg arm64
          bash eng/macos/smoke-test.sh artifacts/linux-built/*-arm64.dmg artifacts/smoke/linux-built-arm64.txt artifacts/smoke/linux-built-arm64.png

      - name: Launch the x64 app under Rosetta
        continue-on-error: true
        run: bash eng/macos/smoke-test.sh artifacts/dist/*-x64.dmg artifacts/smoke/mac-built-x64.txt "" arch -x86_64

      - name: Upload DMGs and smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfme-dmg-built-on-mac
          path: |
            artifacts/dist/*.dmg
            artifacts/dist/SHA256SUMS.txt
            artifacts/smoke/
          if-no-files-found: warn
