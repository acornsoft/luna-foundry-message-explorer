collection: crew-stock
description: >
  A made-up field-crew app reserves stock for job tickets through a chain of integration hops.
  Synthetic data and our own names only.
defaults:
  environment: local
plugins:
  crew-ticket-feed:
    version: "0.1.0"
    command: ["python3", "../../plugins/python/crew_ticket_feed.py"]
  hop-relay:
    version: "0.1.0"
    command: ["dotnet", "../../../artifacts/plugins/HopRelay/HopRelay.dll"]
  bus-observer:
    version: "1.0.0"
    builtin: true
