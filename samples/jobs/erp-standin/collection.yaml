collection: erp-standin
description: Synthetic orders against an ERP-like stand-in. Synthetic data only.
defaults:
  environment: local
plugins:
  order-generator:
    version: "0.2.0"
    command: ["dotnet", "../../../artifacts/plugins/OrderGenerator/OrderGenerator.dll"]
  erp-standin:
    version: "0.2.0"
    command: ["dotnet", "../../../artifacts/plugins/ErpStandin/ErpStandin.dll"]
  bus-observer:
    version: "1.0.0"
    builtin: true
