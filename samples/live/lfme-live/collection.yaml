collection: lfme-live
description: >
  Synthetic traffic for a real Service Bus dev namespace: made-up orders to a queue and made-up crew
  tickets to a topic. Send only; nothing here receives. Synthetic data and our own names only.
defaults:
  environment: live
plugins:
  order-generator:
    version: "0.2.0"
    command: ["dotnet", "../../../artifacts/plugins/OrderGenerator/OrderGenerator.dll"]
  crew-ticket-feed:
    version: "0.1.0"
    command: ["python3", "../../plugins/python/crew_ticket_feed.py"]
