# The namespace comes from the environment so no namespace name lives in the repo. It must also be on
# your local allow-list (<config>/lfme/live-namespaces.txt), or me-jobs send refuses it.
provider: azure-servicebus
namespace: "{{ env.LFME_LIVE_NAMESPACE }}"
variables:
  queue: sbq-lfme-synth-dev-001
  topic: sbt-lfme-synth-dev-001
