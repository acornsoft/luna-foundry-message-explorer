  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #       with: { repository: acornsoft/luna-foundry-message-explorer, ref: develop, path: lfme }
  #     - run: docker build -f lfme/eng/container/Dockerfile -t lfme:local lfme
  #     - env:
  #         SB_LISTEN_CONNECTION: ${{ secrets.SB_LISTEN_CONNECTION }}
  #       run: docker run --rm --read-only -e SB_LISTEN_CONNECTION lfme:local check --connection-string-env SB_LISTEN_CONNECTION --max-dead-letter 0
